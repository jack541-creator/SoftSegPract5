[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphercoin"
version = "1.0.0"
description = "Sistema de criptomoneda con gestor de credenciales integrado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ciphercoin Team" }]

dependencies = [
    "icontract>=2.6",
    "bcrypt>=4.0",
]

[project.scripts]
ciphercoin = "ciphercoin.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100 

[tool.ruff.lint]
# Enable standard lint rules that match Pylint behaviors
select = ["E", "F", "W", "UP"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-lines",
    "duplicate-code"        # False positives in tests
]


[tool.pylint.DESIGN]
max-args = 6                # Reasonable limit for complex functions/GUIs